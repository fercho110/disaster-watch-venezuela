<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d">
  <title id="t">Tectonic stress diagram</title><desc id="d">Two crustal blocks push along a fault with energy waves rising from the center.</desc>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#394d5d"/><stop offset="1" stop-color="#1a2732"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5a3e2a"/><stop offset="1" stop-color="#2a1c15"/></linearGradient>
  </defs>
  <rect width="900" height="620" fill="#0c151e"/>
  <circle cx="450" cy="175" r="130" fill="#ff6b2c" opacity=".05"/>
  <path d="M0 350 365 305 445 330 380 620H0Z" fill="url(#a)"/>
  <path d="M445 330 900 276V620H380Z" fill="#2c3a45"/>
  <path d="M0 475 370 430 380 620H0Z" fill="url(#b)"/>
  <path d="M380 430 900 389V620H380Z" fill="#3a281e"/>
  <path d="M445 330 380 620" stroke="#ff6b2c" stroke-width="8"/>
  <path d="M420 277 376 307M420 277 392 245" stroke="#ffca57" stroke-width="5" stroke-linecap="round"/>
  <path d="M478 292 531 267M478 292 520 318" stroke="#ffca57" stroke-width="5" stroke-linecap="round"/>
  <g fill="none" stroke="#ffca57" opacity=".45">
    <circle cx="430" cy="324" r="55"/><circle cx="430" cy="324" r="92"/><circle cx="430" cy="324" r="132"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="95" y="102" fill="#ffffff" font-size="28" font-weight="700">STRESS BUILDS</text>
    <text x="95" y="138" fill="#93a4b2" font-size="18">Rock blocks push along a fault.</text>
    <text x="570" y="102" fill="#ffffff" font-size="28" font-weight="700">ENERGY RELEASES</text>
    <text x="570" y="138" fill="#93a4b2" font-size="18">Seismic waves spread outward.</text>
    <text x="455" y="520" fill="#ffca57" font-size="17" font-weight="700">FAULT</text>
  </g>
</svg>
